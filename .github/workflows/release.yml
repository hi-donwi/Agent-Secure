name: release

# Publishes agent-secure binaries for the OS/arch pairs where the scanner
# gate is expected to run. Integrity is the whole product here: binaries are
# static, reproducibility-oriented (-trimpath), and checksummed; consumers
# pin the SHA-256 in their external policy (see scripts/bootstrap-policy.sh).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.27'

jobs:
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  build-release:
    name: Build multi-platform release binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compile static binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          TAG_NAME="${GITHUB_REF#refs/tags/}"

          # -trimpath strips local filesystem paths so the same source and tag
          # produce the same bytes on any builder.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            echo "Building ${GOOS}/${GOARCH}..."
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.version=${TAG_NAME#v}" \
              -o "dist/agent-secure-${GOOS}-${GOARCH}" .
          done

      - name: Confirm the Linux binaries are static
        run: |
          set -euo pipefail
          for f in dist/agent-secure-linux-*; do
            file "$f"
            file "$f" | grep -q "statically linked"
          done

      - name: Smoke-test the native binary
        run: |
          set -euo pipefail
          chmod +x dist/agent-secure-linux-amd64
          # The engine exits 2 on the no-args usage path; the smoke test only
          # asserts the message, so the expected exit code must not poison a
          # pipefail pipeline here.
          out="$(./dist/agent-secure-linux-amd64 2>&1 || true)"
          echo "${out}" | grep -q "usage: agent-secure" || {
            echo "binary does not print usage"; exit 1; }

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum agent-secure-* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
