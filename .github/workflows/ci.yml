name: ci

# The engine repo's own gate: unit tests, vet, and a build. The engine's
# security verdicts run against synthetic scanner fixtures in tests; this
# workflow never scans with real credentials or publishes artifacts.

on:
  push:
    branches: [main, feat/security-baseline]
  pull_request:

permissions:
  contents: read

# Dogfood: the engine gates itself with the released engine binary and
# digest-verified scanners, exactly as consumer repos do.
jobs:
  security:
    uses: hi-donwi/Agent-Secure/.github/workflows/agent-secure-gate.yml@3e08b7c34e351ea0764941ee79a7cb039ed0c147
    with:
      root: .
      engine_version: v0.1.3
      engine_sha256: f19b92d17d8c92f0ef8f60a102ead1fe306df23b60cccf42b456a01ecde8202a
      gitleaks_version: 8.30.1
      osv_scanner_version: 2.5.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
