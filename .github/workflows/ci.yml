name: ci

# The engine repo's own gate: unit tests, vet, and a build. The engine's
# security verdicts run against synthetic scanner fixtures in tests; this
# workflow never scans with real credentials or publishes artifacts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Dogfood: the engine gates itself with the released engine binary and
# digest-verified scanners, exactly as consumer repos do.
jobs:
  security:
    uses: hi-donwi/Agent-Secure/.github/workflows/agent-secure-gate.yml@dc9c533d6caade6b3e2f309cef473252c2daab3b
    with:
      root: .
      engine_version: v0.1.1
      gitleaks_version: 8.30.1
      osv_scanner_version: 2.5.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
