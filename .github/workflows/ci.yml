name: ci

# The engine repo's own gate: unit tests, vet, and a build. The engine's
# security verdicts run against synthetic scanner fixtures in tests; this
# workflow never scans with real credentials or publishes artifacts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Dogfood: the engine gates itself with the released engine binary and
# digest-verified scanners, exactly as consumer repos do.
jobs:
  security:
    uses: hi-donwi/Agent-Secure/.github/workflows/agent-secure-gate.yml@0982c6f5818e06f425fe014a685eeceace432330
    with:
      root: .
      engine_version: v0.1.4
      engine_sha256: 13e1935984bcda71f67edafc663a03fb1ed05835fbffaa770eb1563cbe07fc7b
      gitleaks_version: 8.30.1
      gitleaks_sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      osv_scanner_version: 2.5.1
      osv_scanner_sha256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...
